name: Terraform Azure Pipeline

on:
  push:
    branches:
      -  features/pipeline

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login with Service Principal
        uses: azure/login@v2
        with:
          client-id: 3b912ffd-594c-4b81-a37b-dae19e9bc0c9
          tenant-id: fde3126b-b5b9-4d9e-ab0c-f949118194f2
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: e7432041-edd5-4b9d-bd9d-0e1d12ae874e

      - name: Check Azure Login
        run: |
          az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve